<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index HTML By FREEMIUM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #121212;
      color: #2c6399; /* Cor dos títulos */
      font-family: Arial, sans-serif;
    }
    .wrapper {
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
    }
    input {
      background-color: #1e1e1e;
      color: #ff66b3; /* Cor do texto html */
      border: 1px solid #333;
      border-radius: 5px;
      font-weight: bold;
      font-size: 16px;
      height: 50px;
      padding-left: 10px;
      text-align: center;
      flex-grow: 1;
    }
    input::placeholder {
      color: #888;
      font-style: italic;
    }
    textarea {
      background-color: #1e1e1e;
      color: #888; /* Cor do texto html */
      border: 1px solid #333;
      border-radius: 5px;
      font-size: 12px;
      width: 100%;
      font-family: Consolas, monospace;
      resize: none;
      min-height: 65px;
      text-align: center;
      padding: 10px;
      font-style: italic;
      overflow-y: auto;
      display: block;
    }
    button {
      background-color: #1e1e1e;
      color: #8c05fa; /* Cor do texto roxa */
      font-weight: bold;
      border: 1px solid #333;
      border-radius: 5px;
      font-size: 16px;
      padding: 0;
      cursor: pointer;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      height: 50px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    select {
      background-color: #1e1e1e;
      color: #888; /* Cor do texto html */
      border: 1px solid #333;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      padding: 10px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      width: 100%;
      text-align: center;
      text-align-last: center;
      font-style: italic;
    }
    .button-container, .input-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
    }
    .remover-button, .baixar-button, .copy-button, .paste-button, .clear-button {
      position: relative; 
      width: 50px; 
      height: 50px; 
      flex-shrink: 0; 
      margin: 0; 
    }
    .copy-button {
      flex-grow: 1;
      padding: 0 10px;
      height: 50px; 
      font-size: 16px; 
      text-align: center;
    }
    .tooltip {
      visibility: hidden;
      width: max-content;
      background-color: #222;
      color: #ff69b4;
      font-weight: bold, 
      text-align: center;
      border-radius: 5px;
      border: 1px solid #ff66b3;
      padding: 5px 8px;
      position: absolute;
      z-index: 1;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none; 
      white-space: nowrap; 
      font-style: italic;
    }

    .tooltip::before {
      content: "";
      position: absolute;
      top: 100%; 
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px; 
      border-style: solid;
      border-color: #ff66b3 transparent transparent transparent;
      z-index: -1; 
    }
    .tooltip::after {
      content: "";
      position: absolute;
      top: 100%; 
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px; 
      border-style: solid;
      border-color: #222 transparent transparent transparent; 
      z-index: 1; 
    }
    button:hover .tooltip,
    button:focus .tooltip,
    button.active .tooltip {
      visibility: visible;
      opacity: 1;
    }
    .remover-button:active,
    .baixar-button:active,
    .copy-button:active,
    .paste-button:active,
    .clear-button:active {
      color: #ff69b4; /* Rosa */
    }
    .remover-button:hover,
    .baixar-button:hover,
    .copy-button:hover,
    .paste-button:hover,
    .clear-button:hover {
      background-color: #333;
      color: #ff69b4; /* Rosa */
      border-color: #8c05fa; /* Roxo */
    }
    .centered {
      text-align: center;
    }
    .hidden {
      display: none;
    }
    .preview {
      border: 1px solid #333; 
      background-color: #1e1e1e; 
      border-radius: 5px; 
      font-size: 14px;
      text-align: center; 
      width: 100%;
      min-height: 90px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      font-style: italic;
    }
    .separator-resultado, .separator-historico {
      color: #ff69b4; /* Cor  */
      font-size: 14px; 
      font-weight: bold;
      text-align: center; 
      margin: 0px 0;
    }
    .preview h3 {
      font-size: 16px; 
      color: #2c6399; /* Azul */
      font-style: italic;
      margin: 0; 
    }
    .preview p {
      font-size: 14px; 
      font-style: italic;
      color: #888; /* Cinza */
      margin: 0; 
    }
    .categoria-container button {
      background-color: #1e1e1e;
      color: #8c05fa; /* Cor botão confirmar */
      border: 1px solid #333;
      border-radius: 5px;
      font-size: 16px;
      padding: 10px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      width: 100%;
      margin: 0; 
    }
    .categoria-container button:hover {
      background-color: #333;
      color: #ff69b4;
      border-color: #8c05fa; /* Roxo */
    }
    .categoria-container button:active {
      border-color: #8c05fa;
    }
    .flex-container {
      display: flex;
      width: 100%;
      justify-content: space-between;
    }
    .result-box {
      background-color: #2c2c2c;
      padding: 10px;
      border-radius: 5px;
      width: 48%;
      text-align: center;
      min-height: 150px; 
      overflow-y: auto;
      margin: 10px;
    }
    .result-box h3 {
      color: #2c6399; /* Cor do título resultado e histórico */
      font-size: 16px;
    }
    .result-box p {
      margin: 0; 
    }
    .result-box p a {
      text-decoration: none;
      color:; /*Cor do link do resultado*/
    }
    #linksUsadosBox p a {
      color: #888; /* Cor do texto do histórico */
    }
    #linksUsadosBox p a:hover, .result-box p a:hover {
      text-decoration: underline;
    }
    hr {
      border: none;
      border-top: 1px solid #8f3260;
      width: 100%;
    }
    .popup {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translate(-50%, 0);
      background-color: #ff66b2;
      color: Black; /* Cor do texto pop-up */
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 1001;
      text-align: center;
      line-height: 1.5;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .popup.fade-in {
      display: block;
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .popup.fade-out {
      opacity: 0;
      transform: translate(-50%, -10px);
    }
    .scrollable {
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      display: block;
    }
    .scrollable p {
      margin: 0;
    }
    #indexarButton {
      width: 100%;
      font-size: 16px;
      background-color: #1e1e1e;
      color: #8c05fa; /* Cor do texto roxa */
      font-weight: bold;
      border: 1px solid #333;
      border-radius: 5px;
      cursor: pointer;
      margin: 0; 
      display: flex;
      align-items: center;
      justify-content: center;
      height: 50px; 
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      outline: none;
      transition: border-color 0.3s ease, color 0.3s ease; 
    }
    #indexarButton:active {
      border-color: #8c05fa; /* Borda roxa */
      color: #ff69b4; /* Texto rosa */
    }
    #indexarButton:hover {
      color: #ff69b4;
      border-color: #8c05fa !important; 
    }
    @media (max-width: 600px) {
      .tooltip {
        bottom: 110%; 
        font-size: 12px;
        padding: 4px 6px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <hr><br>
    <h1 class="centered">Auto index para HTML</h1><br>
    <div class="input-container">
      <button class="paste-button" onclick="colarTexto()">
    <img src="https://i.imgur.com/5YaVB2B.png" alt="Colar" style="width: 32px; height: 34px; vertical-align: middle;">
    <span class="tooltip">Colar</span>
</button>
      <input type="text" id="link" placeholder="Insira o link" onkeydown="verificarEnter(event)">
      <button class="clear-button" onclick="apagarTexto()">
    <img src="https://i.imgur.com/3hEGxok.png" alt="Apagar" style="width: 32px; height: 34px; vertical-align: middle;">
    <span class="tooltip">Apagar</span>
</button>
    </div>
    <button id="indexarButton" onclick="buscarPrevia()">Buscar</button>
    <div id="conteudoOculto" class="hidden">
      <br><hr><br> 
      <h2 class="centered">Pré-Visualização</h2><br>
      <div id="preview" class="preview"></div>
      <br><hr><br>
      <div class="categoria-container">
        <select id="categoria" onchange="habilitarConfirmarCategoria()">
          <option value="Escolha uma categoria " disabled selected>Escolha uma categoria</option>
          <option value="Marketing Digital">Marketing Digital</option>
          <option value="Tráfego Pago">Tráfego Pago</option>
          <option value="Design">Design</option>
          <option value="Outro">Outro</option>
        </select><br><br>
        <button id="confirmarCategoriaBtn" onclick="confirmarCategoria()" disabled>Confirmar categoria</button>
      </div>
      <br><hr><br>
      <h2 class="centered">Código HTML Gerado</h2><br>
      <textarea id="codigoHtml" readonly></textarea><br>
      <div class="button-container">
          <button class="remover-button" onclick="removerUltimoLink()">
  <img src="https://i.imgur.com/2O3uwWr.png" alt="Desfazer" style="width: 32px; height: 34px; vertical-align: middle;"><span class="tooltip">Desfazer</span>
</button>
          <button class="copy-button" onclick="copiarCodigo()">
            Copiar código HTML
          </button>
          <button class="baixar-button" onclick="baixarCodigo()">
   <img src="https://i.imgur.com/9zdpSEw.png" alt="Baixar" style="width: 32px; height: 34px; vertical-align: middle;"><span class="tooltip">Baixar</span>
      </div><hr>
      <div class="flex-container">
        <div class="result-box" id="resultadosIndexadosBox">
          <h3>Resultado do HTML<br><br></h3>
          <div id="resultado-left"></div>
        </div>
        <div class="result-box" id="linksUsadosBox">
          <h3>Histórico de links<br><br></h3>
          <div id="linksUsados"></div>
        </div>
      </div>
    </div><br><hr><br>
    <div id="popup" class="popup"></div>
  </div><!-- /.wrapper -->
  <script>
    const apiKeys = [
      '4b90f15f1d5cd2b8e95e881c60b88210', 
      '38199a9312115fb93be0c7f348a85e19',
      '0fc0e362348c40ea380b1e257b806f43',
      '62a936443c7f64929009c081cf01c4bf',
      'c325fc178d2186ec7c84e94a07d35d4a'
    ];
    let listaDeLinks = [];
    let urlsJaUtilizadas = new Set();
    let tituloAtual = "";
    function validarLink(link) {
      const regex = /^(https?:\/\/|HTTP?:\/\/|HTTPS?:\/\/)?([\w.-]+)(\.[a-z]{2,})(\/[^\s]*)?$/i;
      return regex.test(link);
    }
    function formatarLink(link) {
      if (!link.match(/^(https?:\/\/|HTTP?:\/\/|HTTPS?:\/\/)/i)) {
        return "http://" + link;
      }
      return link;
    }
    async function buscarPrevia() {
    let link = document.getElementById('link').value.trim();
    link = formatarLink(link);
    if (!validarLink(link)) {
        mostrarPopup("Por favor, insira um link válido!");
        return;
    }
    if (urlsJaUtilizadas.has(link)) {
        mostrarPopup("Este link já foi utilizado anteriormente!");
        return;
    }
    const button = document.getElementById('indexarButton');
    button.innerHTML = "Carregando...";
    const preview = document.getElementById('preview');
    preview.innerHTML = "Carregando pré-visualização...";
    let sucesso = false;
    for (let i = 0; i < apiKeys.length; i++) {
        const currentKey = apiKeys[i];
        try {
            const response = await fetch(`https://api.linkpreview.net/?key=${currentKey}&q=${encodeURIComponent(link)}`);
            const data = await response.json();
            if (data.error) {
                console.error(`Erro com a chave ${currentKey}:`, data.error);
                continue;
            }
            tituloAtual = data.title || "Título indisponível";
            const descricao = data.description || "Descrição indisponível";
            preview.innerHTML = `<h3>${tituloAtual}</h3><p><br>${descricao}</p>`;
            document.getElementById('conteudoOculto').classList.remove('hidden');
            mostrarPopup("Pré-visualização carregada!<br>Escolha uma categoria...");
            sucesso = true;
            break; 
        } catch (error) {
            console.error(`Falha na conexão com a api ${currentKey}:`, error);
        }
    }
    if (!sucesso) {
        preview.innerHTML = "Erro ao buscar o preview, apis insuportável no momento...";
        mostrarPopup("Erro ao buscar a preview. Tente novamente mais tarde.");
    }
    button.innerHTML = "Buscar";
}
    function confirmarCategoria() {
      const linkInput = document.getElementById('link');
      let link = linkInput.value.trim();
      link = formatarLink(link);
      const categoriaSelect = document.getElementById('categoria');
      const categoria = categoriaSelect.value;
      if (!validarLink(link)) {
          mostrarPopup("Por favor, insira um link válido!");
          return;
      }
      if (!categoria || categoria === "Escolha uma categoria ") {
          mostrarPopup("Por favor, selecione uma categoria válida!");
          return;
      }
      if (!urlsJaUtilizadas.has(link)) {
          try {
              const codigoGerado = `<p><a Categoria="${categoria}" href="${link}" target="_blank">${tituloAtual}</a></p>`;
              listaDeLinks.push(codigoGerado);
              urlsJaUtilizadas.add(link);
              atualizarListas(codigoGerado, link);
              mostrarPopup("Categoria confirmada!<br>Código HTML gerado!");
              linkInput.value = ""; 
              categoriaSelect.value = "Escolha uma categoria "; 
              document.getElementById("confirmarCategoriaBtn").disabled = true;
              document.getElementById("preview").innerHTML = "<p style='color: #888; font-style: italic;'>Adicione um novo link para obter<br>novas informações de um site.</p>";
          } catch (error) {
              mostrarPopup("Erro ao processar o link!");
              console.error(error);
          }
      } else {
          mostrarPopup("Este link já foi utilizado anteriormente!");
      }
    }
    function habilitarConfirmarCategoria() {
      const categoria = document.getElementById('categoria').value;
      const confirmarBtn = document.getElementById('confirmarCategoriaBtn');
      confirmarBtn.disabled = !categoria || categoria === "Escolha uma categoria ";
    }
    function atualizarListas(resultado, link) {
      const resultadosDiv = document.getElementById('resultado-left');
      const linksUsadosDiv = document.getElementById('linksUsados');
      if (resultadosDiv.innerHTML !== "") {
        resultadosDiv.innerHTML += `<div class="separator-resultado">------</div>`;
      }
      resultadosDiv.innerHTML += `<div class="scrollable"><p>${resultado}</p></div>`;
      if (linksUsadosDiv.innerHTML !== "") {
        linksUsadosDiv.innerHTML += `<div class="separator-historico">------</div>`;
      }
      linksUsadosDiv.innerHTML += `<div class="scrollable"><p><a href="${link}" target="_blank">${link}</a></p></div>`;
      const codigoHtmlBox = document.getElementById('codigoHtml');
      codigoHtmlBox.value = listaDeLinks.join("\n");
      ajustarAlturaTextarea(codigoHtmlBox);
    }
    function ajustarAlturaTextarea(textarea) {
      textarea.style.height = "auto";
      textarea.style.height = textarea.scrollHeight + "px";
    }
    function copiarCodigo() {
      const textarea = document.getElementById('codigoHtml');
      textarea.select();
      document.execCommand('copy');
      mostrarPopup("Código copiado!");
    }
    function mostrarPopup(mensagem) {
    const popup = document.getElementById('popup');
    popup.innerHTML = mensagem;
    popup.classList.remove('fade-in', 'fade-out');
    popup.style.display = 'block';
    setTimeout(() => {
        popup.classList.add('fade-in');
    }, 10);
    setTimeout(() => {
        popup.classList.remove('fade-in');
        popup.classList.add('fade-out');
        setTimeout(() => {
            popup.style.display = 'none';
        }, 300);
    }, 1500);
}
    async function colarTexto() {
      try {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
          mostrarPopup("Recurso de colar, não suportado neste navegador.");
          return;
        }
        const textoCopiado = await navigator.clipboard.readText();
        document.getElementById("link").value = textoCopiado;
        mostrarPopup("Você colou!");
      } catch (err) {
        mostrarPopup("Erro ao colar texto. Verifique as permissões!");
        console.error(err);
      }
    }
    function apagarTexto() {
      document.getElementById("link").value = "";
      mostrarPopup("Texto apagado.");
    }
    function verificarEnter(event) {
      if (event.key === "Enter") {
        buscarPrevia();
      }
    }
    function removerUltimoLink() {
      if (listaDeLinks.length === 0) {
        mostrarPopup("Nenhum link para remover!");
        return;
      }
      const ultimoLink = listaDeLinks.pop();
      const regex = /href="([^"]+)"/;
      const match = ultimoLink.match(regex);
      if (match && match[1]) {
        urlsJaUtilizadas.delete(match[1]);
      }
      atualizarListasVisuais();
      const codigoHtmlBox = document.getElementById('codigoHtml');
      codigoHtmlBox.value = listaDeLinks.join("\n");
      ajustarAlturaTextarea(codigoHtmlBox);

      mostrarPopup("Último link removido!");
    }
    function atualizarListasVisuais() {
      const resultadosDiv = document.getElementById('resultado-left');
      const linksUsadosDiv = document.getElementById('linksUsados');
      resultadosDiv.innerHTML = '';
      linksUsadosDiv.innerHTML = '';
      listaDeLinks.forEach((link, index) => {
        if (index > 0) {
          resultadosDiv.innerHTML += `<div class="separator-resultado">------</div>`;
          linksUsadosDiv.innerHTML += `<div class="separator-historico">------</div>`;
        }
        resultadosDiv.innerHTML += `<div class="scrollable"><p>${link}</p></div>`;
        const match = link.match(/href="([^"]+)"/);
        const url = match && match[1] ? match[1] : '#';
        linksUsadosDiv.innerHTML += `<div class="scrollable"><p><a href="${url}" target="_blank">${url}</a></p></div>`;
      });
    }
    function baixarCodigo() {
      const codigoHtml = document.getElementById('codigoHtml').value;
      if (!codigoHtml) {
        mostrarPopup("Não há código para baixar!");
        return;
      }
      const blob = new Blob([codigoHtml], { type: 'text/html' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'CódigoGerado.html';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      mostrarPopup("O download do HTML, iniciou!");
    }
    function toggleTooltip(event) {
      const button = event.currentTarget;
      button.classList.toggle('active');
      document.querySelectorAll('.button-container button').forEach(btn => {
        if (btn !== button) {
          btn.classList.remove('active');
        }
      });
    }
    document.querySelectorAll('.button-container button').forEach(button => {
      button.addEventListener('touchstart', toggleTooltip);
      button.addEventListener('click', toggleTooltip);
    });
    document.addEventListener('touchstart', function(event) {
      if (!event.target.closest('.button-container button')) {
        document.querySelectorAll('.button-container button').forEach(btn => {
          btn.classList.remove('active');
        });
      }
    });
  </script>
</body>
    </html>
